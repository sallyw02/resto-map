<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Santa Clara County Restaurants</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div id="map" class="map">
      <img class="basemap" src="sccRestaurantsMap2026.png" alt="Map of Santa Clara County">
      <canvas id="dots"></canvas>
      <svg id="overlay"></svg>
    </div>

    <aside class="panel">
      <h1>Santa Clara County restaurants</h1>
      <p id="count" class="count">Loading data…</p>
      <p id="missing" class="note"></p>
    </aside>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
